<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08111f">
    <title>You are offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f8fafc;
        background: radial-gradient(circle at 50% 25%, #153361 0, #08111f 58%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 36px 30px;
        text-align: center;
        border: 1px solid #334155;
        border-radius: 24px;
        background: rgb(15 23 42 / 88%);
        box-shadow: 0 28px 80px rgb(0 0 0 / 45%);
      }
      .scene {
        height: 126px;
        display: grid;
        place-items: center;
        perspective: 500px;
      }
      .orb {
        width: 84px;
        height: 84px;
        display: grid;
        place-items: center;
        border: 1px solid #60a5fa;
        border-radius: 26px;
        color: #bfdbfe;
        background: linear-gradient(145deg, #1d4ed8, #0f172a 72%);
        box-shadow: 0 16px 32px rgb(37 99 235 / 35%), inset 0 1px 10px rgb(191 219 254 / 25%);
        transform: rotateX(18deg) rotateY(-18deg);
        animation: float 2.8s ease-in-out infinite;
      }
      .orb svg { width: 38px; height: 38px; }
      .signal { transform-origin: center; }
      .signal-wave { animation: signal-drop 1.8s ease-in-out infinite; }
      .signal-wave:nth-of-type(2) { animation-delay: 0.18s; }
      .signal-wave:nth-of-type(3) { animation-delay: 0.36s; }
      .signal-slash { animation: slash-flash 1.8s ease-in-out infinite; }
      .connection-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        padding: 7px 11px;
        border: 1px solid rgb(248 113 113 / 35%);
        border-radius: 999px;
        color: #fecaca;
        background: rgb(127 29 29 / 22%);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fb7185;
        box-shadow: 0 0 0 0 rgb(251 113 133 / 55%);
        animation: status-pulse 1.5s ease-out infinite;
      }
      h1 { margin: 12px 0 8px; font-size: 23px; }
      p { margin: 0; color: #cbd5e1; font-size: 14px; line-height: 1.6; }
      button {
        margin-top: 24px;
        padding: 11px 20px;
        border: 1px solid #60a5fa;
        border-radius: 12px;
        color: white;
        background: #1d4ed8;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #2563eb; }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotateX(18deg) rotateY(-18deg); }
        50% { transform: translateY(-10px) rotateX(24deg) rotateY(12deg); }
      }
      @keyframes signal-drop {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.18; }
      }
      @keyframes slash-flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.52; }
      }
      @keyframes status-pulse {
        0% { box-shadow: 0 0 0 0 rgb(251 113 133 / 55%); }
        70%, 100% { box-shadow: 0 0 0 7px rgb(251 113 133 / 0%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb, .signal-wave, .signal-slash, .status-dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="scene" aria-hidden="true">
        <div class="orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <g class="signal">
              <path class="signal-wave" d="M5 9.5a11 11 0 0 1 14 0" />
              <path class="signal-wave" d="M8 13a6.5 6.5 0 0 1 8 0" />
              <path class="signal-wave" d="M11 16.5a2 2 0 0 1 2 0" />
              <path class="signal-slash" d="M3 3l18 18" />
            </g>
          </svg>
        </div>
      </div>
      <h1>You’re offline</h1>
      <p>Your System Will be Restored When You Are Connected To The Internet, Check Your Internet Connection To Reconnect</p>
      <div class="connection-status" role="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span>No internet connection</div>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () { window.location.reload(); });
    </script>
  </body>
</html>
